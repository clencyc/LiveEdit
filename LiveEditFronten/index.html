
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Edit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="description" content="LiveEdit is an AI-powered studio for real-time video analysis, editing, and generation built on Google Gemini.">
    <meta name="theme-color" content="#0a0a0a">
    <!-- Anti-flash: apply saved theme before render -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('app-theme');
          var theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- Microsoft Clarity - loaded asynchronously to avoid blocking -->
    <script type="text/javascript">
        // Defer Clarity loading until after page is interactive
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                (function(c,l,a,r,i,t,y){
                    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
                })(window, document, "clarity", "script", "v8d4j6voj2");
            });
        } else {
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", "v8d4j6voj2");
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0a0a0a;
            --text: #d1d1d1;
            --text-strong: #ffffff;
            --surface: #161616;
            --surface-raised: #1f1f1f;
            --border: #2a2a2a;
            --muted: #737373;
            --muted-strong: #a3a3a3;
            --input: #1f1f1f;
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f5f5;
            --text: #1a1a1a;
            --text-strong: #171717;
            --surface: #ffffff;
            --surface-raised: #eeeeee;
            --border: #d4d4d4;
            --muted: #666666;
            --muted-strong: #525252;
            --input: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
            letter-spacing: -0.01em;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .editor-bg { background-color: var(--bg); }
        .editor-surface { background-color: var(--surface); }
        .editor-border { border-color: var(--border); }
        .editor-input { background-color: var(--input); border-color: var(--border); }

        .editor-theme-content { color: var(--text); }

        html[data-theme="light"] .editor-theme-card {
            background-color: var(--surface) !important;
            color: var(--text-strong);
            border-color: var(--border);
        }

        html[data-theme="light"] .editor-theme-modal {
            background-color: var(--surface) !important;
            color: var(--text-strong);
            border-color: var(--border);
            box-shadow: 0 24px 80px rgb(15 23 42 / 18%);
        }

        html[data-theme="light"] .editor-theme-overlay {
            background-color: rgb(15 23 42 / 42%) !important;
        }

        html[data-theme="light"] .editor-theme-toggle {
            color: var(--muted-strong);
            border-color: var(--border);
        }


        /*
         * Light-theme compatibility layer.
         *
         * The UI intentionally uses a dark editorial palette in dark mode. Map
         * utility classes used for dark surfaces to the shared theme tokens in
         * light mode so legacy screens stay readable without changing the dark
         * theme or rewriting every component at once.
         */
        html[data-theme="light"] [class*="bg-neutral-950"],
        html[data-theme="light"] [class*="bg-neutral-900"],
        html[data-theme="light"] [class*="bg-gray-950"],
        html[data-theme="light"] [class*="bg-gray-900"],
        html[data-theme="light"] [class*="bg-slate-950"],
        html[data-theme="light"] [class*="bg-slate-900"],
        html[data-theme="light"] [class*="bg-slate-800"],
        html[data-theme="light"] [class~="bg-[#050505]"],
        html[data-theme="light"] [class~="bg-[#0a0a0a]"],
        html[data-theme="light"] [class~="bg-[#0b0b0b]"],
        html[data-theme="light"] [class~="bg-[#0c0c0c]"],
        html[data-theme="light"] [class~="bg-[#0d0d0d]"],
        html[data-theme="light"] [class~="bg-[#0f0f0f]"],
        html[data-theme="light"] [class~="bg-[#111]"],
        html[data-theme="light"] [class~="bg-[#111111]"],
        html[data-theme="light"] [class~="bg-[#131313]"],
        html[data-theme="light"] [class~="bg-[#141414]"],
        html[data-theme="light"] [class~="bg-[#161616]"],
        html[data-theme="light"] [class~="bg-[#181818]"],
        html[data-theme="light"] [class*="bg-[#201b2d]"] {
            background-color: var(--surface);
        }

        html[data-theme="light"] [class*="bg-neutral-800"],
        html[data-theme="light"] [class*="bg-neutral-700"],
        html[data-theme="light"] [class*="bg-gray-800"],
        html[data-theme="light"] [class*="bg-gray-700"],
        html[data-theme="light"] [class*="bg-gray-600"],
        html[data-theme="light"] [class*="bg-slate-800"],
        html[data-theme="light"] [class*="bg-slate-700"],
        html[data-theme="light"] [class~="bg-[#1a1a1a]"],
        html[data-theme="light"] [class~="bg-[#1f1f1f]"],
        html[data-theme="light"] [class~="bg-[#222]"],
        html[data-theme="light"] [class~="bg-[#222222]"] {
            background-color: var(--surface-raised);
        }

        /* Keep translucent overlay utilities usable on a light canvas. */
        html[data-theme="light"] [class*="bg-black/"],
        html[data-theme="light"] [class*="bg-neutral-950/"],
        html[data-theme="light"] [class*="bg-neutral-900/"],
        html[data-theme="light"] [class*="bg-gray-950/"],
        html[data-theme="light"] [class*="bg-gray-900/"] {
            background-color: color-mix(in srgb, var(--surface-raised) 94%, transparent);
        }

        html[data-theme="light"] [class~="bg-black"] {
            background-color: var(--bg);
        }

        html[data-theme="light"] [class*="text-white"],
        html[data-theme="light"] [class*="text-neutral-50"],
        html[data-theme="light"] [class*="text-neutral-100"],
        html[data-theme="light"] [class*="text-neutral-200"],
        html[data-theme="light"] [class*="text-neutral-300"],
        html[data-theme="light"] [class*="text-gray-50"],
        html[data-theme="light"] [class*="text-gray-100"],
        html[data-theme="light"] [class*="text-gray-200"],
        html[data-theme="light"] [class*="text-gray-300"],
        html[data-theme="light"] [class*="text-slate-50"],
        html[data-theme="light"] [class*="text-slate-100"],
        html[data-theme="light"] [class*="text-slate-200"],
        html[data-theme="light"] [class*="text-slate-300"] {
            color: var(--text-strong);
        }

        html[data-theme="light"] [class*="text-neutral-400"],
        html[data-theme="light"] [class*="text-neutral-500"],
        html[data-theme="light"] [class*="text-neutral-600"],
        html[data-theme="light"] [class*="text-neutral-700"],
        html[data-theme="light"] [class*="text-neutral-800"],
        html[data-theme="light"] [class*="text-gray-400"],
        html[data-theme="light"] [class*="text-gray-500"],
        html[data-theme="light"] [class*="text-gray-600"],
        html[data-theme="light"] [class*="text-gray-700"],
        html[data-theme="light"] [class*="text-slate-400"],
        html[data-theme="light"] [class*="text-slate-500"],
        html[data-theme="light"] [class*="text-slate-600"],
        html[data-theme="light"] [class*="text-slate-700"] {
            color: var(--muted-strong);
        }

        html[data-theme="light"] [class*="border-neutral-"],
        html[data-theme="light"] [class*="border-slate-"],
        html[data-theme="light"] [class*="border-gray-"] {
            border-color: var(--border);
        }

        /* Make native form controls follow the selected theme. */
        html[data-theme="light"] input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]),
        html[data-theme="light"] textarea,
        html[data-theme="light"] select {
            color: var(--text-strong);
            caret-color: currentColor;
        }

        html[data-theme="light"] input::placeholder,
        html[data-theme="light"] textarea::placeholder {
            color: #666666;
            opacity: 1;
        }

        html[data-theme="light"] [class~="from-black"] {
            --tw-gradient-from: var(--bg) var(--tw-gradient-from-position);
            --tw-gradient-to: rgb(245 245 245 / 0) var(--tw-gradient-to-position);
            --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to);
        }

        html[data-theme="light"] [class~="to-black"] {
            --tw-gradient-to: var(--bg) var(--tw-gradient-to-position);
        }

        html[data-theme="light"] [class~="via-[#0a0a0a]"] {
            --tw-gradient-to: rgb(245 245 245 / 0) var(--tw-gradient-to-position);
            --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-via), var(--tw-gradient-to);
            --tw-gradient-via: var(--bg) var(--tw-gradient-via-position);
        }

        /* Translate dark gradient endpoints on older screens too. */
        html[data-theme="light"] [class*="from-neutral-950"],
        html[data-theme="light"] [class*="from-neutral-900"],
        html[data-theme="light"] [class*="from-gray-950"],
        html[data-theme="light"] [class*="from-gray-900"],
        html[data-theme="light"] [class*="from-slate-950"],
        html[data-theme="light"] [class*="from-slate-900"] {
            --tw-gradient-from: var(--surface) var(--tw-gradient-from-position);
            --tw-gradient-to: rgb(255 255 255 / 0) var(--tw-gradient-to-position);
            --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to);
        }

        html[data-theme="light"] [class*="via-neutral-950"],
        html[data-theme="light"] [class*="via-neutral-900"],
        html[data-theme="light"] [class*="via-gray-950"],
        html[data-theme="light"] [class*="via-gray-900"] {
            --tw-gradient-to: rgb(255 255 255 / 0) var(--tw-gradient-to-position);
            --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-via), var(--tw-gradient-to);
            --tw-gradient-via: var(--surface) var(--tw-gradient-via-position);
        }

        html[data-theme="light"] [class*="to-neutral-950"],
        html[data-theme="light"] [class*="to-neutral-900"],
        html[data-theme="light"] [class*="to-gray-950"],
        html[data-theme="light"] [class*="to-gray-900"],
        html[data-theme="light"] [class*="to-slate-950"],
        html[data-theme="light"] [class*="to-slate-900"] {
            --tw-gradient-to: var(--surface) var(--tw-gradient-to-position);
        }


        /* Saturated workflow-node labels need stronger contrast in light mode. */
        html[data-theme="light"] .workflow-start-node {
            background-color: #166534 !important;
            border-color: #14532d;
        }

        html[data-theme="light"] .workflow-stop-node {
            background-color: #991b1b !important;
            border-color: #7f1d1d;
        }

        html[data-theme="light"] .workflow-start-node,
        html[data-theme="light"] .workflow-stop-node {
            color: #ffffff;
        }

        /* Preserve the subscription card's blue-to-purple identity on a light canvas. */
        html[data-theme="light"] [class*="from-blue-900"] {
            --tw-gradient-from: #eff6ff var(--tw-gradient-from-position);
            --tw-gradient-to: rgb(239 246 255 / 0) var(--tw-gradient-to-position);
            --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to);
        }

        html[data-theme="light"] [class*="to-purple-900"] {
            --tw-gradient-to: #f3e8ff var(--tw-gradient-to-position);
        }

        /* Accent colors stay the same */
        .accent-green { color: #00ff41; }
        .accent-magenta { color: #f0f; }
        .accent-cyan { color: #0ff; }
        
        html[data-theme="dark"] .glass-pro {
            background: color-mix(in srgb, var(--surface) 85%, transparent);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        html[data-theme="light"] .glass-pro {
            background: color-mix(in srgb, var(--surface) 85%, transparent);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        html[data-theme="dark"] .tab-active {
            background: var(--surface-raised);
            color: var(--text-strong);
            border-bottom: 2px solid #00ff41;
        }

        html[data-theme="light"] .tab-active {
            background: var(--surface-raised);
            color: var(--text-strong);
            border-bottom: 2px solid #00ff41;
        }

        .color-wheel {
            background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
            border-radius: 50%;
            position: relative;
        }

        html[data-theme="dark"] .color-wheel::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: var(--surface);
            border-radius: 50%;
        }

        html[data-theme="light"] .color-wheel::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: var(--surface);
            border-radius: 50%;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        
        html[data-theme="dark"] ::-webkit-scrollbar-track { background: var(--bg); }
        html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: #444; }

        html[data-theme="light"] ::-webkit-scrollbar-track { background: var(--bg); }
        html[data-theme="light"] ::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 2px; }
        html[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #b0b0b0; }
    </style>

</script>
</head>

</html>
